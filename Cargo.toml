[package]
name = "clipboard-manager"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Windows-style clipboard history for Ubuntu, Debian and Debian-based distributions"
authors = ["clipboard-manager contributors"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/example/clipboard-manager"
keywords = ["clipboard", "clipboard-manager", "gtk", "wayland", "x11"]
categories = ["gui"]

# Split into a library plus a thin binary so that the integration tests in
# `tests/` can drive the storage, search and clipboard layers directly.
[lib]
name = "clipboard_manager"
path = "src/lib.rs"

[[bin]]
name = "clipboard-manager"
path = "src/main.rs"

[dependencies]
# ---- GUI (GTK3: present on every Ubuntu 20.04+/Debian 11+ target) -------------
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
glib = "0.18"
gio = "0.18"
pango = "0.18"
cairo-rs = "0.18"

# ---- Storage -----------------------------------------------------------------
# `bundled` statically links SQLite with FTS5 so we do not depend on the
# distribution's libsqlite3 version across a five-year release window.
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }

# ---- Platform layers (pure Rust protocol implementations) --------------------
x11rb = { version = "0.13", features = ["xfixes", "allow-unsafe-code"] }
wayland-client = "0.31"
# Pinned with `=`: wayland-protocols >= 0.32.12 raises its MSRV to 1.86, which
# would break builds on the Rust toolchains shipped by the distributions in our
# support window (§22). These crates are generated protocol bindings and are
# effectively frozen, so pinning costs nothing. Bump both together once the
# oldest supported toolchain catches up.
wayland-protocols = "=0.32.5"
wayland-protocols-wlr = { version = "=0.3.5", features = ["client"] }

# ---- Desktop integration -----------------------------------------------------
zbus = { version = "4", default-features = false, features = ["async-io"] }
ksni = "0.2"

# ---- Plumbing ----------------------------------------------------------------
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
async-channel = "2"
libc = "0.2"
urlencoding = "2"
base64 = "0.22"
# Lets the Rust-side matcher fold diacritics the same way the FTS5 tokenizer's
# `remove_diacritics 2` option does, so ranking agrees with the index.
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
