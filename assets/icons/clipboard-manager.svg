<?xml version="1.0" encoding="UTF-8"?>
<!--
  clipboard-manager application icon.

  Drawn as a clipboard with a stack of lines behind it, suggesting history.
  Monochrome-friendly shapes and a 2px grid at 48px so it stays legible when
  the icon theme scales it down to 16px for a tray.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- the "history" sheets peeking out behind -->
  <rect x="14" y="4"  width="24" height="30" rx="3" fill="#8a9099"/>
  <rect x="11" y="7"  width="24" height="30" rx="3" fill="#aeb4bd"/>

  <!-- the front clipboard -->
  <rect x="8" y="10" width="28" height="34" rx="3" fill="#f2f4f7" stroke="#5a616b" stroke-width="2"/>

  <!-- the clip -->
  <path d="M17 8h10a2 2 0 0 1 2 2v3H15v-3a2 2 0 0 1 2-2z" fill="#5a616b"/>
  <rect x="19" y="4" width="6" height="6" rx="2" fill="#5a616b"/>

  <!-- lines of copied text -->
  <rect x="13" y="20" width="18" height="2.5" rx="1.25" fill="#5a616b"/>
  <rect x="13" y="26" width="18" height="2.5" rx="1.25" fill="#5a616b"/>
  <rect x="13" y="32" width="11" height="2.5" rx="1.25" fill="#5a616b"/>
</svg>
